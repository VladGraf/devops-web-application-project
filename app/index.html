<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevOps Web Application Project</title>
<style>body{background:#101827;color:#edf3ff;font-family:system-ui,Arial;margin:0;padding:42px 18px}.wrap{max-width:850px;margin:auto}h1{font-size:2.3rem}p{color:#a9bad2}.card{background:#1b2940;border:1px solid #314462;border-radius:14px;padding:22px;margin:15px 0}.tag{color:#78dcbb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.num{font-size:1.5rem;font-weight:700}code{color:#c5e6ff}button{background:#4b83ff;color:white;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}</style></head>
<body><div class="wrap"><h1>DevOps Web Application Project</h1><p>Running on K3s inside Docker</p><div class="card"><div class="tag">● Application is running</div><h2>Version: {{VERSION}}</h2><p>Pod: <code>{{POD}}</code></p><button onclick="refresh()">Refresh metrics</button></div><div class="grid"><div class="card">Service<div class="num" id="service">Loading</div></div><div class="card">Memory used<div class="num" id="memory">—</div></div><div class="card">CPU time<div class="num" id="cpu">—</div></div><div class="card">Network RX / TX<div class="num" id="network">—</div></div></div><p>Metrics are for this app container. Open Kibana on port 5601 to see logs.</p></div>
<script>async function refresh(){try{let r=await fetch('/api/status');let d=await r.json();document.getElementById('service').textContent=d.status;document.getElementById('memory').textContent=d.memory.used_mb+' MB';document.getElementById('cpu').textContent=d.cpu_usage_usec===null?'N/A':(d.cpu_usage_usec/1e6).toFixed(1)+' s';document.getElementById('network').textContent=Math.round(d.network.received_bytes/1024)+' / '+Math.round(d.network.sent_bytes/1024)+' KB'}catch(e){document.getElementById('service').textContent='Unavailable'}}refresh();setInterval(refresh,5000)</script></body></html>
